server:
  port: 8081

spring:
  application:
    name: auth-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:832115590292-i3h1b0qs87tahau5gq653ifdf5mum93r.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - openid
              - profile
              - email

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:sage-secret-key-super-secure-at-least-32-bytes-long}

sage:
  ai:
    provider: ${AI_PROVIDER:google-gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:${GEMINI_FALLBACK_API_KEY:}}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-3-flash-preview}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:25}
  email:
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${EMAIL_FROM:SAGE <onboarding@resend.dev>}
    worker:
      enabled: ${REMINDER_WORKER_ENABLED:true}
      interval-ms: ${REMINDER_WORKER_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    auth_service: ${SAGE_AUTH_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SAGE_SQL_LOG_LEVEL:WARN}
    org.springframework.web: ${SAGE_WEB_LOG_LEVEL:WARN}
  file:
    name: ${SAGE_LOG_DIR:../logs}/auth-service.log
