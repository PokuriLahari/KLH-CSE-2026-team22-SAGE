spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id
            client-secret: dummy-google-client-secret
            scope: openid,profile,email

  cloud:
    config:
      enabled: false

jwt:
  secret: test-secret-key-super-secure-at-least-32-bytes-long

sage:
  ai:
    provider: "google-gemini"
    gemini:
      api-key: ""
      base-url: "https://generativelanguage.googleapis.com/v1beta"
      model: "gemini-3.8-flash"
      timeout-seconds: 5
  email:
    resend:
      api-key: ""
      from: "SAGE <onboarding@resend.dev>"
    worker:
      enabled: false
      interval-ms: 60000

