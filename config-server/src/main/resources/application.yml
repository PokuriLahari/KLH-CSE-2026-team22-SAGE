server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: file:///D:/Documents/Documents/PROJECTS/sage-config-repo
          default-label: main
        clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.cloud.config: ${SAGE_CONFIG_LOG_LEVEL:INFO}
  file:
    name: ${SAGE_LOG_DIR:../logs}/config-server.log
